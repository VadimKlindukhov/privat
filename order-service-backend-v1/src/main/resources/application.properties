spring.application.name=order-service-backend-v1

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:orders}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orders}
spring.datasource.driver-class-name=org.postgresql.Driver

# schema.sql runs on every startup (idempotent via IF NOT EXISTS); mirrors ddl.sql at the project root.
spring.sql.init.mode=always

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
